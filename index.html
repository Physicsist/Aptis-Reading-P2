      font-weight: 600;
      border-radius: 4px;

        "answer": "considers the environmental impact",
        "meaningVi": "Cân nhắc tác động đến môi trường"
      },
      {
        "speakerNumber": 4,
        "code": "14.4",
        "answer": "shops only on the internet",
        "meaningVi": "Chỉ mua sắm trên Internet"
      }
    ]
  }
];
    let showAnswersGlobal = false;
    const userSelections = {};
    const gradedTopics = {};

    function normalize(str) {
      return (str || "").trim().toLowerCase();
    }

    function updateGlobalStats() {
      let attempted = 0;
      let correct = 0;
      let wrong = 0;

      TOPICS.forEach((topic) => {
        topic.speakers.forEach((sp) => {
          const key = topic.id + "-" + sp.speakerNumber;
          const val = userSelections[key] || "";
          if (val) {
            attempted++;
            if (normalize(val) === normalize(sp.answer)) {
              correct++;
            } else {
              wrong++;
            }
          }
        });
      });

      const rate = attempted > 0 ? Math.round((correct / attempted) * 100) : 0;
      document.getElementById("statAttempted").textContent = "Đã chọn: " + attempted + "/124";
      document.getElementById("statCorrect").textContent = "✓ Đúng: " + correct;
      document.getElementById("statWrong").textContent = "✗ Sai: " + wrong;
      document.getElementById("statAccuracy").textContent = "Tỷ lệ đúng: " + rate + "%";
    }

    function renderTopics(filterText = "") {
      const container = document.getElementById("topicsContainer");
      const q = normalize(filterText);
      container.innerHTML = "";

      TOPICS.forEach((topic) => {
        const matchTitle = normalize(topic.title).includes(q) || normalize(topic.meaningVi).includes(q);
        const matchBank = topic.questionBank.some((opt) => normalize(opt).includes(q));
        if (q && !matchTitle && !matchBank) return;

        const flamesStr = topic.flames > 0 ? " " + "🔥".repeat(topic.flames) : "";
        const block = document.createElement("div");
        block.className = "topic-block";
        block.id = "topic-block-" + topic.id;

        const bankRowsHtml = topic.questionBank
          .map((opt) => `<tr class="bank-row"><td>${opt}</td></tr>`)
          .join("");

        const isTopicGraded = !!gradedTopics[topic.id];
        let topicCorrectCount = 0;
        let topicAttemptedCount = 0;

        const speakersHtml = topic.speakers
          .map((sp) => {
            const key = topic.id + "-" + sp.speakerNumber;
            const selectedVal = userSelections[key] || "";
            const isCorrect = selectedVal !== "" && normalize(selectedVal) === normalize(sp.answer);
            const isWrong = selectedVal !== "" && !isCorrect;

            if (selectedVal !== "") topicAttemptedCount++;
            if (isCorrect) topicCorrectCount++;

            const optionsHtml = [
              '<option value="">Chọn đáp án...</option>',
              ...topic.questionBank.map((opt) => {
                const isSelected = selectedVal === opt ? "selected" : "";
                return `<option value="${opt.replace(/"/g, '&quot;')}" ${isSelected}>${opt}</option>`;
              }),
            ].join("");

            let itemClass = "speaker-item";
            let selectClass = "speaker-select";
            let badgeClass = "status-badge";
            let badgeText = "";

            if (isCorrect) {
              itemClass += " graded-correct";
              selectClass += " correct";
              badgeClass += " correct";
              badgeText = "✓ ĐÚNG";
            } else if (isWrong) {
              itemClass += " graded-wrong";
              selectClass += " wrong";
              badgeClass += " wrong";
              badgeText = "✗ SAI";
            } else if (isTopicGraded) {
              itemClass += " graded-empty";
              badgeClass += " empty";
              badgeText = "⚠ Chưa chọn";
            }

            const showDetail = showAnswersGlobal || isTopicGraded || isCorrect || isWrong;

            return `
              <div class="${itemClass}" id="speaker-item-${key}">
                <div class="speaker-header">
                  <span class="speaker-label">Speaker ${sp.speakerNumber} <em>(${sp.code})</em></span>
                  <div class="speaker-control-wrap">
                    <select class="${selectClass}" data-topic="${topic.id}" data-speaker="${sp.speakerNumber}" onchange="onSelectAnswer(this)">
                      ${optionsHtml}
                    </select>
                    <span class="${badgeClass}">${badgeText}</span>
                  </div>
                </div>
                <div class="answer-details ${showDetail ? '' : 'hidden'}">
                  ${isWrong ? `<div class="user-wrong-choice">✗ Bạn đã chọn: <del>${selectedVal}</del></div>` : ''}
                  <div class="answer-en">✓ Đáp án đúng: <u>${sp.answer}</u></div>
                  <div class="answer-vi"><strong>Nghĩa:</strong> <em>${sp.meaningVi}</em></div>
                </div>
              </div>
            `;
          })
          .join("");

        let bannerClass = "topic-score-banner";
        let bannerText = "";
        if (isTopicGraded || topicAttemptedCount === 4) {
          bannerClass += " show ";
          if (topicCorrectCount === 4) {
            bannerClass += "perfect";
            bannerText = `🎉 Xuất sắc! Bạn trả lời đúng tuyệt đối 4/4 câu (100%).`;
          } else if (topicCorrectCount >= 2) {
            bannerClass += "partial";
            bannerText = `Kết quả chấm Chủ đề ${topic.id}: Đúng ${topicCorrectCount}/4 câu (${Math.round((topicCorrectCount/4)*100)}%).`;
          } else {
            bannerClass += "low";
            bannerText = `Kết quả chấm Chủ đề ${topic.id}: Đúng ${topicCorrectCount}/4 câu (${Math.round((topicCorrectCount/4)*100)}%) — Hãy xem kỹ đáp án bên dưới.`;
          }
        }

        block.innerHTML = `
          <div class="topic-header">
            <div>
              <div class="topic-title">CHỦ ĐỀ ${topic.id}: ${topic.title}${flamesStr}</div>
              <p class="topic-meaning"><strong>Nghĩa chủ đề:</strong> <em>${topic.meaningVi}</em></p>
            </div>
            <div class="topic-actions">
              <button class="btn btn-success" onclick="gradeSingleTopic(${topic.id})">✓ Chấm điểm</button>
              <button class="btn" onclick="resetSingleTopic(${topic.id})">Làm lại</button>
            </div>
          </div>
          <div class="${bannerClass}">
            <span>${bannerText}</span>
            <span>Đã chọn: ${topicAttemptedCount}/4</span>
          </div>
          <table class="bank-table">
            <thead>
              <tr><th class="bank-header">QUESTION BANK – CHỌN ĐÁP ÁN</th></tr>
            </thead>
            <tbody>
              ${bankRowsHtml}
            </tbody>
          </table>
          <div class="speakers-list">
            ${speakersHtml}
          </div>
        `;

        container.appendChild(block);
      });

      updateGlobalStats();
    }

    window.onSelectAnswer = function(selectEl) {
      const topicId = Number(selectEl.getAttribute("data-topic"));
      const speakerNum = Number(selectEl.getAttribute("data-speaker"));
      const key = topicId + "-" + speakerNum;
      userSelections[key] = selectEl.value;
      renderTopics(document.getElementById("searchInput").value);
    };

    window.gradeSingleTopic = function(topicId) {
      gradedTopics[topicId] = true;
      renderTopics(document.getElementById("searchInput").value);
    };

    window.resetSingleTopic = function(topicId) {
      delete gradedTopics[topicId];
      for (let i = 1; i <= 4; i++) {
        delete userSelections[topicId + "-" + i];
      }
      renderTopics(document.getElementById("searchInput").value);
    };

    document.getElementById("searchInput").addEventListener("input", (e) => {
      renderTopics(e.target.value);
    });

    document.getElementById("gradeAllBtn").addEventListener("click", () => {
      TOPICS.forEach((t) => {
        gradedTopics[t.id] = true;
      });
      renderTopics(document.getElementById("searchInput").value);
    });

    document.getElementById("toggleAnswersBtn").addEventListener("click", () => {
      showAnswersGlobal = !showAnswersGlobal;
      renderTopics(document.getElementById("searchInput").value);
    });

    document.getElementById("resetPracticeBtn").addEventListener("click", () => {
      Object.keys(userSelections).forEach((k) => delete userSelections[k]);
      Object.keys(gradedTopics).forEach((k) => delete gradedTopics[k]);
      showAnswersGlobal = false;
      renderTopics(document.getElementById("searchInput").value);
    });

    renderTopics();
  </script>
</body>
</html>

<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Listening P2 - Aptis Real Exam Trainer</title>
    <style>
        :root {
            --bg: #f1f5f9;
            --card: #ffffff;
            --text: #0f172a;
            --subtext: #475569;
            --primary: #1565c0;
            --primary-hover: #0d47a1;
            --primary-light: #e3f2fd;
            --bank-header: #1976d2;
            --accent: #6d28d9;
            --success: #16a34a;
            --success-bg: #dcfce7;
            --danger: #dc2626;
            --danger-bg: #fee2e2;
            --border: #cbd5e1;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            padding: 12px;
            max-width: 840px;
            margin: 0 auto;
        }
        header {
            background: var(--card);
            padding: 14px 16px;
            border-radius: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            margin-bottom: 12px;
            border: 1px solid var(--border);
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
        }
        h1 { font-size: 1.18rem; font-weight: 800; color: var(--primary); }
        .stats-bar {
            display: flex;
            gap: 6px;
            font-size: 0.82rem;
            font-weight: 600;
            flex-wrap: wrap;
        }
        .badge {
            padding: 4px 10px;
            border-radius: 99px;
            background: var(--bg);
            border: 1px solid var(--border);
        }
        .badge.timer { color: var(--primary); background: var(--primary-light); border-color: transparent; }
        .badge.srs { color: var(--danger); background: var(--danger-bg); border-color: transparent; }

        .filter-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
            overflow-x: auto;
            padding-bottom: 2px;
        }
        .tab-btn {
            flex: 1;
            white-space: nowrap;
            text-align: center;
            padding: 8px 10px;
            font-size: 0.83rem;
            border-radius: 8px;
            background: var(--bg);
            border: 1px solid var(--border);
            cursor: pointer;
            font-weight: 600;
            color: var(--text);
        }
        .tab-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 8px;
        }
        @media (max-width: 580px) {
            .controls { grid-template-columns: 1fr 1fr; }
            .controls select { grid-column: span 2; }
        }
        select, button {
            padding: 9px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--card);
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text);
            cursor: pointer;
        }
        button:active { transform: scale(0.98); }
        .btn-primary { background: var(--primary); color: #fff; border: none; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-outline { background: var(--bg); }

        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px dashed var(--border);
            font-size: 0.82rem;
            color: var(--subtext);
            flex-wrap: wrap;
            gap: 10px;
        }
        .toggle-row label { display: flex; align-items: center; gap: 5px; cursor: pointer; font-weight: 500; }

        /* MAIN EXAM CARD */
        .quiz-card {
            background: var(--card);
            padding: 18px 16px;
            border-radius: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }
        .topic-header {
            margin-bottom: 12px;
        }
        .topic-title {
            font-size: 1.12rem;
            font-weight: 800;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex-wrap: wrap;
        }
        .topic-vi {
            font-size: 0.92rem;
            color: var(--subtext);
            margin-top: 2px;
        }

        /* QUESTION BANK TABLE (GIỐNG PDF & ĐỀ THI) */
        .question-bank-box {
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 16px;
        }
        .qb-top-prompt {
            background: #f8fafc;
            padding: 8px 12px;
            font-weight: 700;
            font-size: 0.9rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .qb-blue-bar {
            background: var(--bank-header);
            color: #ffffff;
            padding: 9px 12px;
            font-weight: 800;
            font-size: 0.92rem;
            letter-spacing: 0.3px;
        }
        .qb-list {
            display: flex;
            flex-direction: column;
        }
        .qb-item {
            width: 100%;
            text-align: left;
            padding: 11px 14px;
            border: none;
            border-bottom: 1px solid #e2e8f0;
            border-radius: 0;
            background: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            transition: background 0.12s ease;
        }
        .qb-item:last-child { border-bottom: none; }
        .qb-item:hover:not(:disabled) {
            background: var(--primary-light);
        }
        .qb-item.used-item {
            background: #f8fafc;
            color: #94a3b8;
        }
        .qb-item-en {
            font-size: 0.96rem;
            font-weight: 600;
        }
        .qb-item-vi {
            display: block;
            font-size: 0.82rem;
            color: var(--subtext);
            font-weight: 400;
            margin-top: 2px;
        }
        .assigned-pill {
            display: inline-block;
            background: var(--accent);
            color: #fff;
            font-size: 0.73rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 99px;
            margin-left: 6px;
        }

        /* 4 SPEAKERS SECTION */
        .speakers-section-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--subtext);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .speakers-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }
        .speaker-slot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 11px 14px;
            border-radius: 10px;
            border: 2px solid var(--border);
            background: #f8fafc;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .speaker-slot.active-slot {
            border-color: var(--primary);
            background: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(21, 101, 192, 0.15);
        }
        .speaker-slot.filled-slot {
            background: #ffffff;
            border-color: #64748b;
        }
        .speaker-slot.correct-slot {
            background: var(--success-bg);
            border-color: var(--success);
        }
        .speaker-slot.wrong-slot {
            background: var(--danger-bg);
            border-color: var(--danger);
        }

        .slot-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }
        .speaker-tag {
            background: var(--primary);
            color: #fff;
            font-weight: 700;
            font-size: 0.84rem;
            padding: 6px 10px;
            border-radius: 6px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .speaker-slot.correct-slot .speaker-tag { background: var(--success); }
        .speaker-slot.wrong-slot .speaker-tag { background: var(--danger); }

        .slot-content {
            flex: 1;
            min-width: 0;
        }
        .slot-placeholder {
            color: #64748b;
            font-style: italic;
            font-size: 0.9rem;
        }
        .slot-en {
            font-weight: 700;
            font-size: 0.96rem;
            color: var(--text);
            text-decoration: underline;
        }
        .slot-vi {
            font-size: 0.82rem;
            color: var(--subtext);
            display: block;
            margin-top: 2px;
        }
        .slot-correction {
            margin-top: 5px;
            font-size: 0.84rem;
            color: #065f46;
            background: #d1fae5;
            padding: 5px 9px;
            border-radius: 6px;
            display: inline-block;
            font-weight: 600;
        }
        .clear-slot-btn {
            background: #e2e8f0;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-weight: bold;
            color: var(--subtext);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .clear-slot-btn:hover { background: #cbd5e1; color: var(--danger); }

        .speak-icon {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .exam-dropdown {
            width: 100%;
            padding: 8px 10px;
            font-size: 0.92rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: #fff;
            font-weight: 600;
        }

        .action-bar {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }
        .action-bar button {
            flex: 1;
            padding: 13px;
            font-size: 0.98rem;
            border-radius: 10px;
        }

        .feedback-box {
            margin-top: 14px;
            padding: 13px 15px;
            border-radius: 10px;
            background: #f8fafc;
            border-left: 4px solid var(--primary);
            display: none;
        }
        .feedback-box.show { display: block; }
    </style>
</head>

    </div>

    <div class="controls">
        <select id="lessonSelect" onchange="selectSpecificLesson(this.value)">
            <option value="all">-- Chế độ trộn ngẫu nhiên thông minh --</option>
        </select>
        <button class="btn-outline" onclick="prevLesson()">⬅ Bài trước</button>
        <button class="btn-outline" onclick="nextLesson()">Bài tiếp ➡</button>
    </div>

    <div class="toggle-row">
        <label><input type="checkbox" id="showViToggle" checked onchange="renderLesson()"> Hiện nghĩa tiếng Việt</label>
        <label><input type="checkbox" id="shuffleBankToggle" onchange="reloadBankOrder()"> Xáo trộn Question Bank</label>
        <label><input type="checkbox" id="dropdownModeToggle" onchange="renderLesson()"> Chế độ Dropdown</label>

    </div>
</header>

// QUẢN LÝ TRẠNG THÁI & LẶP LẠI NGẮT QUÃNG
let srsLessonWeights = JSON.parse(localStorage.getItem('aptis_p2_31_srs') || '{}');
let stats = JSON.parse(localStorage.getItem('aptis_p2_31_stats') || '{"correct":0,"total":0}');
let currentMode = 'all'; // 'all', 'hot', 'srs'
let selectedLessonId = 'all';
let currentLesson = null;
let displayedOptions = [];
let userSelections = [null, null, null, null]; // Index của displayedOptions cho Speaker 1, 2, 3, 4
let activeSlot = 0; // 0 -> 3 tương ứng Speaker 1 -> 4
let isSubmitted = false;
let countdownTimer = null;
let timeLeft = 45;

function saveState() {
    localStorage.setItem('aptis_p2_31_srs', JSON.stringify(srsLessonWeights));
    localStorage.setItem('aptis_p2_31_stats', JSON.stringify(stats));
    updateStatsUI();
}

function updateStatsUI() {
    document.getElementById('scoreDisplay').textContent = `Đúng: ${stats.correct}/${stats.total}`;
    const srsCount = Object.values(srsLessonWeights).filter(w => w > 0).length;
    document.getElementById('srsDisplay').textContent = `Cần ôn: ${srsCount}`;
    document.getElementById('srsTabCount').textContent = srsCount;
}

function initDropdown() {
    const select = document.getElementById('lessonSelect');
    LESSONS_DATA.forEach(l => {
        const opt = document.createElement('option');
        opt.value = l.id;
        const fireStr = l.flames > 0 ? "🔥".repeat(l.flames) + " " : "";
        opt.textContent = `${fireStr}${l.title} (${l.topicVi})`;
        select.appendChild(opt);
    });
}

function shuffleArray(arr) {
    const copy = [...arr];
    for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
}

function pickNextLesson() {
    if (selectedLessonId !== 'all') {
        return LESSONS_DATA.find(l => l.id === parseInt(selectedLessonId)) || LESSONS_DATA[0];
    }

    let pool = LESSONS_DATA;
    if (currentMode === 'hot') {
        pool = LESSONS_DATA.filter(l => l.flames >= 4);
    } else if (currentMode === 'srs') {
        pool = LESSONS_DATA.filter(l => (srsLessonWeights[l.id] || 0) > 0);
        if (pool.length === 0) {
            alert("Tuyệt vời! Bạn không còn chủ đề nào làm sai cần ôn lại. Chuyển về chế độ Tất cả.");
            setMode('all');
            return pickNextLesson();
        }
    }

    let weightedPool = [];
    pool.forEach(l => {
        if (currentLesson && pool.length > 1 && l.id === currentLesson.id) return;
        const wrongWeight = srsLessonWeights[l.id] || 0;
        const weight = 1 + (l.flames >= 4 ? 2 : 0) + (wrongWeight * 5);
        for (let i = 0; i < weight; i++) weightedPool.push(l);
    });

    return weightedPool[Math.floor(Math.random() * weightedPool.length)];
}

function startTimer() {
    clearInterval(countdownTimer);
    timeLeft = 45;
    const timerEl = document.getElementById('timerDisplay');
    timerEl.textContent = `⏱ ${timeLeft}s`;

    countdownTimer = setInterval(() => {
        timeLeft--;
        timerEl.textContent = `⏱ ${timeLeft}s`;
        if (timeLeft <= 0) {
            clearInterval(countdownTimer);
            if (!isSubmitted) {
                submitExam();
            }
        }
    }, 1000);
}

function speakText(text, event) {
    if (event) event.stopPropagation();
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'en-GB';
    utter.rate = 0.95;
    window.speechSynthesis.speak(utter);
}

function reloadBankOrder() {
    if (!currentLesson) return;
    userSelections = [null, null, null, null];
    activeSlot = 0;
    isSubmitted = false;
    const shouldShuffle = document.getElementById('shuffleBankToggle').checked;
    displayedOptions = shouldShuffle ? shuffleArray(currentLesson.options) : [...currentLesson.options];
    renderLesson();
}

function loadNewLesson(specificLessonObj = null) {
    isSubmitted = false;
    userSelections = [null, null, null, null];
    activeSlot = 0;
    currentLesson = specificLessonObj || pickNextLesson();
    const shouldShuffle = document.getElementById('shuffleBankToggle').checked;
    displayedOptions = shouldShuffle ? shuffleArray(currentLesson.options) : [...currentLesson.options];
    renderLesson();
    startTimer();

    if (document.getElementById('autoAudioToggle').checked) {
        const cleanTopic = currentLesson.title.replace(/CHỦ ĐỀ \d+:\s*/i, '').replace(/\(2026\).*/i, '');
        speakText(cleanTopic);
    }
}

function setActiveSlot(slotIdx) {
    if (isSubmitted) return;
    activeSlot = slotIdx;
    renderLesson();
}

function clearSlot(slotIdx, event) {
    if (event) event.stopPropagation();
    if (isSubmitted) return;
    userSelections[slotIdx] = null;
    activeSlot = slotIdx;
    renderLesson();
}

// KHI HỌC SINH BẤM VÀO LỰA CHỌN TRONG QUESTION BANK -> ĐIỀN LẦN LƯỢT SPEAKER 1, 2, 3, 4
function selectOptionFromBank(optIdx) {
    if (isSubmitted) return;

    // Nếu lựa chọn này đã được gán cho một Speaker khác, gỡ khỏi Speaker cũ
    const existingSpeaker = userSelections.indexOf(optIdx);
    if (existingSpeaker !== -1 && existingSpeaker !== activeSlot) {
        userSelections[existingSpeaker] = null;
    }

    // Gán vào vị trí Speaker hiện tại
    userSelections[activeSlot] = optIdx;

    if (document.getElementById('autoAudioToggle').checked) {
        speakText(displayedOptions[optIdx].en);
    }

    // Tự động chuyển sang vị trí Speaker tiếp theo còn trống (1 -> 2 -> 3 -> 4)
    let nextEmpty = -1;
    for (let i = 1; i <= 4; i++) {
        const checkIdx = (activeSlot + i) % 4;
        if (userSelections[checkIdx] === null) {
            nextEmpty = checkIdx;
            break;
        }
    }

    if (nextEmpty !== -1) {
        activeSlot = nextEmpty;
        renderLesson();
    } else {
        // Đã chọn đủ cả 4 vị trí Speaker 1, 2, 3, 4 -> Chấm điểm ngay
        renderLesson();
        submitExam();
    }
}

function handleDropdownChange(slotIdx, val) {
    if (isSubmitted) return;
    if (val === "") {
        userSelections[slotIdx] = null;
    } else {
        const optIdx = parseInt(val);
        userSelections[slotIdx] = optIdx;
        if (document.getElementById('autoAudioToggle').checked) {
            speakText(displayedOptions[optIdx].en);
        }
    }
    renderLesson();
}

function renderLesson() {
    if (!currentLesson) return;
    const showVi = document.getElementById('showViToggle').checked;
    const isDropdownMode = document.getElementById('dropdownModeToggle').checked;
    const container = document.getElementById('quizContainer');

    const debtCount = srsLessonWeights[currentLesson.id] || 0;
    const debtBadge = debtCount > 0 ? `<span style="color:var(--danger); font-size:0.85rem;">• Đang nợ (${debtCount})</span>` : '';
    const flamesHTML = currentLesson.flames > 0 ? "🔥".repeat(currentLesson.flames) : '<span style="font-size:0.8rem; color:var(--subtext)">Chủ đề bổ trợ</span>';

    // 1. BẢNG QUESTION BANK – CHỌN ĐÁP ÁN (GIỐNG TRONG FILE PDF)
    let questionBankHTML = "";
    if (!isDropdownMode) {
        let bankItemsHTML = displayedOptions.map((opt, oIdx) => {
            const assignedSpeakerIdx = userSelections.indexOf(oIdx);
            const isUsed = assignedSpeakerIdx !== -1;
            const escapedEn = opt.en.replace(/'/g, "\\'");

            return `
                <button class="qb-item ${isUsed ? 'used-item' : ''}" onclick="selectOptionFromBank(${oIdx})" ${isSubmitted ? 'disabled' : ''}>
                    <div>
                        <span class="qb-item-en">${opt.en}</span>
                        ${isUsed ? `<span class="assigned-pill">Speaker ${assignedSpeakerIdx + 1}</span>` : ''}
                        ${showVi ? `<span class="qb-item-vi">${opt.vi}</span>` : ''}
                    </div>
                    <span class="speak-icon" onclick="speakText('${escapedEn}', event)" title="Nghe phát âm">🔊</span>
                </button>
            `;
        }).join('');

        questionBankHTML = `
            <div class="question-bank-box">
                <div class="qb-top-prompt">
                    <span>Chọn đáp án...</span>
                    ${!isSubmitted ? `<span style="color:var(--primary)">👉 Đang chọn cho: <strong>Speaker ${activeSlot + 1}</strong></span>` : ''}
                </div>
                <div class="qb-blue-bar">QUESTION BANK – CHỌN ĐÁP ÁN</div>
                <div class="qb-list">
                    ${bankItemsHTML}
                </div>
            </div>
        `;
    }

    // 2. DANH SÁCH 4 SPEAKER (14.1 -> 14.4)
    let speakersHTML = currentLesson.answers.map((ans, sIdx) => {
        const selectedOptIdx = userSelections[sIdx];
        const selectedOpt = selectedOptIdx !== null ? displayedOptions[selectedOptIdx] : null;
        const isCorrect = isSubmitted && selectedOpt && selectedOpt.en.toLowerCase() === ans.en.toLowerCase();

        let slotClass = "speaker-slot";
        if (isSubmitted) {
            slotClass += isCorrect ? " correct-slot" : " wrong-slot";
        } else {
            if (sIdx === activeSlot && !isDropdownMode) slotClass += " active-slot";
            else if (selectedOpt) slotClass += " filled-slot";
        }

        let innerContent = "";
        if (isDropdownMode && !isSubmitted) {
            let dropdownOpts = `<option value="">Chọn đáp án...</option>`;
            displayedOptions.forEach((o, oIdx) => {
                const isSelected = selectedOptIdx === oIdx ? "selected" : "";
                dropdownOpts += `<option value="${oIdx}" ${isSelected}>${o.en} ${showVi ? `(${o.vi})` : ''}</option>`;
            });
            innerContent = `<select class="exam-dropdown" onchange="handleDropdownChange(${sIdx}, this.value)">${dropdownOpts}</select>`;
        } else {
            if (selectedOpt) {
                innerContent = `
                    <div>Đáp án chọn: <span class="slot-en">${selectedOpt.en}</span></div>
                    ${showVi ? `<span class="slot-vi">Nghĩa: ${selectedOpt.vi}</span>` : ''}
                `;
            } else {
                innerContent = `<div class="slot-placeholder">${sIdx === activeSlot ? '👉 Bấm vào 1 câu trong Question Bank ở trên để điền...' : 'Chưa chọn (Bấm vào đây nếu muốn chọn trước)'}</div>`;
            }
        }

        let correctionHTML = "";
        if (isSubmitted && !isCorrect) {
            correctionHTML = `<div class="slot-correction">✔ Đáp án đúng: <u>${ans.en}</u> ${showVi ? `— <em>${ans.vi}</em>` : ''}</div>`;
        }

        const escapedAnsEn = ans.en.replace(/'/g, "\\'");

        return `
            <div class="${slotClass}" onclick="setActiveSlot(${sIdx})">
                <div class="slot-left">
                    <span class="speaker-tag">${ans.sp}</span>
                    <div class="slot-content">
                        ${innerContent}
                        ${correctionHTML}
                    </div>
                </div>
                ${(!isSubmitted && !isDropdownMode && selectedOpt)
                    ? `<button class="clear-slot-btn" onclick="clearSlot(${sIdx}, event)" title="Xoá lựa chọn này">✕</button>`
                    : `<span class="speak-icon" onclick="speakText('${escapedAnsEn}', event)" title="Nghe đáp án đúng">🔊</span>`
                }
            </div>
        `;
    }).join('');

    container.innerHTML = `
        <div class="topic-header">
            <div class="topic-title">
                <span>${currentLesson.title} ${debtBadge}</span>
                <span>${flamesHTML}</span>
            </div>
            ${showVi ? `<div class="topic-vi"><strong>Nghĩa chủ đề:</strong> <em>${currentLesson.topicVi}</em></div>` : ''}
        </div>

        ${questionBankHTML}

        <div class="speakers-section-title">
            <span>Thứ tự người nói (Lần lượt chọn Speaker 1 ➔ 2 ➔ 3 ➔ 4):</span>
            <span style="font-size:0.8rem;">Trang ${currentLesson.id} / 31</span>
        </div>

        <div class="speakers-grid">
            ${speakersHTML}
        </div>

        <div class="action-bar">
            ${!isSubmitted
                ? `<button class="btn-primary" onclick="submitExam()">✔ Chấm điểm (Hoặc chọn đủ 4 Speaker)</button>`
                : `<button class="btn-outline" onclick="retryCurrentLesson()">🔄 Làm lại chủ đề này</button>
                   <button class="btn-primary" onclick="nextLesson()">Chủ đề tiếp theo ➔</button>`
            }
        </div>

        <div class="feedback-box ${isSubmitted ? 'show' : ''}" id="feedbackBox">
            <div id="feedbackSummary"></div>
        </div>
    `;
}

function submitExam() {
    if (isSubmitted) return;
    isSubmitted = true;
    clearInterval(countdownTimer);

    let correctCount = 0;
    currentLesson.answers.forEach((ans, sIdx) => {
        const selectedOptIdx = userSelections[sIdx];
        const selectedOpt = selectedOptIdx !== null ? displayedOptions[selectedOptIdx] : null;
        if (selectedOpt && selectedOpt.en.toLowerCase() === ans.en.toLowerCase()) {
            correctCount++;
        }
    });

    stats.total += 4;
    stats.correct += correctCount;

    if (correctCount === 4) {
        if (srsLessonWeights[currentLesson.id]) {
            srsLessonWeights[currentLesson.id]--;
            if (srsLessonWeights[currentLesson.id] <= 0) delete srsLessonWeights[currentLesson.id];
        }
    } else {
        srsLessonWeights[currentLesson.id] = (srsLessonWeights[currentLesson.id] || 0) + 2;
    }

    saveState();
    renderLesson();

    const fbSummary = document.getElementById('feedbackSummary');
    if (correctCount === 4) {
        fbSummary.innerHTML = `<strong style="color:var(--success); font-size:1rem;">🎉 Chính xác tuyệt đối 4/4 vị trí Speaker!</strong>`;
    } else {
        fbSummary.innerHTML = `<strong style="color:var(--danger); font-size:1rem;">📌 Kết quả: Đúng ${correctCount}/4 vị trí. (Hệ thống đã lưu chủ đề này vào mục "Chủ đề làm sai" để bạn ôn lại)</strong>`;
    }
}

function retryCurrentLesson() {
    loadNewLesson(currentLesson);
}

function setMode(mode) {
    currentMode = mode;
    selectedLessonId = 'all';
    document.getElementById('lessonSelect').value = 'all';
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(`tab-${mode}`).classList.add('active');
    loadNewLesson();
}

function selectSpecificLesson(val) {
    selectedLessonId = val;
    loadNewLesson();
}

function prevLesson() {
    const currIdx = LESSONS_DATA.findIndex(l => l.id === currentLesson.id);
    const prevIdx = (currIdx - 1 + LESSONS_DATA.length) % LESSONS_DATA.length;
    selectedLessonId = LESSONS_DATA[prevIdx].id;
    document.getElementById('lessonSelect').value = selectedLessonId;
    loadNewLesson(LESSONS_DATA[prevIdx]);
}

function nextLesson() {
    if (selectedLessonId === 'all') {
        loadNewLesson();
    } else {
        const currIdx = LESSONS_DATA.findIndex(l => l.id === currentLesson.id);
        const nextIdx = (currIdx + 1) % LESSONS_DATA.length;
        selectedLessonId = LESSONS_DATA[nextIdx].id;
        document.getElementById('lessonSelect').value = selectedLessonId;
        loadNewLesson(LESSONS_DATA[nextIdx]);
    }
}

function resetProgress() {
    if (confirm("Bạn muốn xoá toàn bộ điểm số và lịch sử câu sai để luyện lại từ đầu?")) {
        srsLessonWeights = {};
        stats = { correct: 0, total: 0 };
        saveState();
        loadNewLesson();
    }
}

// KHỞI CHẠY ỨNG DỤNG
initDropdown();
updateStatsUI();
loadNewLesson();
</script>

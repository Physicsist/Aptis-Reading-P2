<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reading P5</title>
    <style>
        :root {
            --bg: #f1f5f9;
            --card: #ffffff;
            --text: #0f172a;
            --sub: #475569;
            --primary: #2563eb;
            --primary-bg: #eff6ff;
            --success: #16a34a;
            --success-bg: #dcfce7;
            --danger: #dc2626;
            --danger-bg: #fee2e2;
            --warn: #d97706;
            --warn-bg: #fef3c7;
            --border: #cbd5e1;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            padding-bottom: 50px;
        }
        header {
            background: var(--card);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .brand { font-size: 1.15rem; font-weight: 800; color: var(--primary); cursor: pointer; }
        .stats-bar { display: flex; gap: 6px; align-items: center; font-size: 0.8rem; font-weight: 700; }
        .badge { padding: 4px 8px; border-radius: 6px; background: var(--bg); border: 1px solid var(--border); }
        .badge.hot { background: var(--warn-bg); color: var(--warn); border-color: #fde68a; }
        
        .container { max-width: 680px; margin: 0 auto; padding: 12px; }
        
        .nav-tabs { display: flex; gap: 6px; margin-bottom: 12px; background: #cbd5e1; padding: 4px; border-radius: 10px; }
        .tab-btn {
            flex: 1; border: none; background: transparent; padding: 9px 4px;
            font-size: 0.85rem; font-weight: 700; color: var(--sub); border-radius: 7px; cursor: pointer;
        }
        .tab-btn.active { background: var(--card); color: var(--primary); }

        .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; justify-content: space-between; }
        select, .btn {
            padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--card); font-size: 0.88rem; font-weight: 600; color: var(--text); cursor: pointer;
        }
        .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
        .btn-sm { padding: 5px 9px; font-size: 0.8rem; }
        .btn-audio { background: var(--primary-bg); color: var(--primary); border-color: #93c5fd; }

        .card {
            background: var(--card); border-radius: 12px; border: 1px solid var(--border);
            padding: 14px; margin-bottom: 12px;
        }

        .quiz-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 0.85rem; color: var(--sub); font-weight: 700; }
        .timer { font-weight: 800; color: var(--primary); font-size: 1rem; }
        .timer.low { color: var(--danger); }

        .passage-box {
            font-size: 1rem; line-height: 1.6; margin: 10px 0 14px;
            padding: 12px; background: #f8fafc; border-left: 4px solid var(--primary); border-radius: 6px;
        }
        .key-hint { font-weight: inherit; }
        .answered .key-hint {
            background: #fef08a; font-weight: 700; text-decoration: underline;
            padding: 1px 3px; border-radius: 3px;
        }

        .options-list { display: flex; flex-direction: column; gap: 8px; }
        .opt-btn {
            text-align: left; padding: 12px; border-radius: 8px;
            border: 1.5px solid var(--border); background: var(--card);
            font-size: 0.95rem; font-weight: 600; color: var(--text);
            cursor: pointer; width: 100%;
        }
        .opt-btn.correct { background: var(--success-bg); border-color: var(--success); color: #065f46; font-weight: 700; }
        .opt-btn.wrong { background: var(--danger-bg); border-color: var(--danger); color: #991b1b; }

        .feedback {
            margin-top: 14px; padding: 12px; border-radius: 8px;
            background: #f8fafc; border: 1px solid var(--border); font-size: 0.9rem; display: none;
        }
        .feedback.show { display: block; }
        .chain-box {
            margin-top: 8px; padding: 10px; background: var(--warn-bg);
            border: 1px solid #fde68a; border-radius: 6px; font-size: 0.85rem; color: #92400e;
        }
        .next-btn { width: 100%; margin-top: 12px; padding: 12px; font-size: 1rem; font-weight: 700; }

        /* Speed Chain */
        .slot-grid { display: flex; flex-direction: column; gap: 6px; margin: 12px 0; }
        .slot-row { display: flex; align-items: center; gap: 8px; }
        .slot-num { width: 30px; font-weight: 800; font-size: 0.85rem; color: var(--sub); }
        .slot-box {
            flex: 1; min-height: 40px; border: 1.5px dashed var(--border); border-radius: 8px;
            display: flex; align-items: center; padding: 6px 10px; font-size: 0.9rem; font-weight: 600;
            background: #f8fafc; cursor: pointer;
        }
        .slot-box.filled { border-style: solid; border-color: var(--primary); background: var(--primary-bg); color: var(--primary); }
        .slot-box.correct { border-style: solid; border-color: var(--success); background: var(--success-bg); color: #065f46; }
        .slot-box.wrong { border-style: solid; border-color: var(--danger); background: var(--danger-bg); color: #991b1b; }
        .bank-pool { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .chip {
            padding: 8px 12px; border-radius: 18px; border: 1px solid var(--border);
            background: var(--card); font-size: 0.85rem; font-weight: 600; cursor: pointer;
        }
        .chip.used { opacity: 0.3; pointer-events: none; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<header>
    <div class="brand" id="brandBtn">⚡ Reading P5</div>
    <div class="stats-bar">
        <span class="badge hot" id="srsCountBadge">SRS: 0</span>
        <span class="badge" id="masteredBadge">0/105</span>
    </div>
</header>

<div class="container">
    <div class="nav-tabs">
        <button class="tab-btn active" id="tabBtnQuiz" type="button">🎯 Luyện Đọc</button>
        <button class="tab-btn" id="tabBtnChain" type="button">⚡ Chuỗi P1→P7</button>
        <button class="tab-btn" id="tabBtnStudy" type="button">📖 15 Chủ Đề</button>
    </div>

    <!-- VIEW 1: QUIZ -->
    <div id="viewQuiz">
        <div class="toolbar">
            <select id="quizFilter">
                <option value="priority">🔥 Ưu tiên cao (Bài 1, 2, 3)</option>
                <option value="all">📚 Tất cả 15 chủ đề (105 câu)</option>
                <option value="mistakes">⚠️ Chỉ ôn câu sai (SRS)</option>
            </select>
            <div style="display:flex; gap:6px; align-items:center;">
                <label style="font-size:0.8rem; font-weight:600; color:var(--sub);">
                    <input type="checkbox" id="autoAudioToggle"> Tự đọc
                </label>
                <select id="timerSetting">
                    <option value="25">⏱ 25s</option>
                    <option value="45">⏱ 45s</option>
                    <option value="0">∞ Không giờ</option>
                </select>
            </div>
        </div>

        <div class="card" id="quizCard">
            <div class="quiz-top">
                <span id="qTopicName">Đang tải...</span>
                <span class="timer" id="qTimer">25s</span>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px;">
                <span style="font-size:0.85rem; font-weight:700; color:var(--primary);" id="qParaNum">Paragraph 1/7</span>
                <div style="display:flex; gap:6px;">
                    <button class="btn btn-sm btn-audio" id="btnSpeakPass" type="button">🔊 Đọc đoạn</button>
                    <button class="btn btn-sm btn-audio" id="btnSpeakAns" type="button">🔊 Đọc Đ.Án</button>
                </div>
            </div>

            <div class="passage-box" id="qPassage"></div>
            <div class="options-list" id="qOptions"></div>

            <div class="feedback" id="qFeedback">
                <div id="fbStatus" style="font-weight:800; margin-bottom:4px;"></div>
                <div style="color:var(--sub); font-size:0.82rem;">💡 <i>Phần tô vàng gạch chân trên đoạn văn là key dẫn chứng.</i></div>
                <div class="chain-box" id="fbChain"></div>
                <button class="btn btn-primary next-btn" id="btnNextQ" type="button">Câu tiếp theo ➔</button>
            </div>
        </div>
    </div>

    <!-- VIEW 2: CHAIN -->
    <div id="viewChain" class="hidden">
        <div class="toolbar">
            <select id="chainTopicSelect"></select>
            <button class="btn btn-sm btn-audio" id="btnSpeakChain" type="button">🔊 Đọc chuỗi</button>
        </div>
        <div class="card">
            <div style="font-size:0.95rem; font-weight:700; color:var(--primary); margin-bottom:4px;" id="chainMeaning"></div>
            <div class="chain-box" style="margin-bottom:10px;">
                <div><b>Chuỗi nhớ (EN):</b> <span id="chainEnHint"></span></div>
                <div><b>Nghĩa (VI):</b> <span id="chainViHint"></span></div>
            </div>
            <p style="font-size:0.82rem; color:var(--sub); margin-bottom:6px;">Chạm vào các đáp án bên dưới để xếp theo thứ tự P1 → P7 (chạm vào ô P để xóa):</p>
            <div class="slot-grid" id="chainSlots"></div>
            <div class="bank-pool" id="chainPool"></div>
            <div style="display:flex; gap:8px; margin-top:14px;">
                <button class="btn" style="flex:1" id="btnResetChain" type="button">🔄 Làm lại</button>
                <button class="btn btn-primary" style="flex:1" id="btnShowChain" type="button">👁 Xem đáp án</button>
            </div>
        </div>
    </div>

    <!-- VIEW 3: STUDY LIST -->
    <div id="viewStudy" class="hidden">
        <div class="toolbar">
            <span style="font-size:0.9rem; font-weight:700;">Toàn bộ 15 chủ đề</span>
            <button class="btn btn-sm" id="btnClearSRS" type="button" style="color:var(--danger);">🗑 Xóa lịch sử học</button>
        </div>
        <div id="studyList"></div>
    </div>
</div>

<script>
// ================= DỮ LIỆU 15 CHỦ ĐỀ =================
var TOPICS = [
  {
    id: 1, title: "1. Mountain (2026)", priority: true, meaning: "Núi và trải nghiệm leo núi",
    chainEn: "Definition → Achievement → Publicity → Priorities → Connections → Stability → Relationships",
    chainVi: "Định nghĩa núi → Thành tựu → Công khai thành tích → Sai ưu tiên → Mối liên kết đáng lo → Ổn định → Quan hệ thân thiết",
    paragraphs: [
      { p: 1, ans: "Changing the definition of mountain", text: "<span class='key-hint'>For centuries, physical features such as height and steepness were the main criteria used to distinguish a mountain from a hill.</span> Yet those measurements do not always settle the question: a modest peak may dominate local history, while a taller one may barely stand out from a plateau. Modern discussions therefore take account of prominence, landscape, local usage, and even the meaning attached to a place by the people who live nearby." },
      { p: 2, ans: "Unique sense of achievement", text: "Success in many sports can be measured by a score, a medal, or a finishing time. Reaching a summit is different because the result is inseparable from the climber's private struggle with fear, exhaustion, weather, and self-doubt. Two people may stand on the same peak but experience entirely different journeys. <span class='key-hint'>What matters most is often not the altitude itself, but the knowledge that a limit once thought fixed has been surpassed.</span>" },
      { p: 3, ans: "Publicity of achievement", text: "A summit photograph once remained in a family album or a climber's personal journal. <span class='key-hint'>Today, an ascent may be followed in real time by thousands of viewers, promoted by sponsors, and judged through likes and comments.</span> This exposure can motivate others to attempt difficult goals, but it can also shift attention from the experience itself to the image created around it. The climb becomes something performed for an audience as well as remembered by the individual." },
      { p: 4, ans: "Misguided priorities", text: "Preparing for a major expedition can demand months of training, substantial savings, and long periods away from home. <span class='key-hint'>For some climbers, the next ascent gradually becomes more important than work, family commitments, or financial security.</span> Because determination is widely admired, this imbalance may be praised rather than questioned. The difficulty lies in recognizing when devotion to a demanding goal has stopped enriching life and begun to damage the responsibilities that make ordinary life possible." },
      { p: 5, ans: "Worrying connections", text: "People who face danger together often develop loyalty more quickly than those who meet in ordinary settings. Yet a group built around risk can develop its own expectations, making caution appear weak and withdrawal feel like betrayal. Members may encourage one another to continue despite poor weather, fatigue, or inadequate preparation. <span class='key-hint'>The same bond that provides trust and support can therefore make it harder for an individual to challenge a reckless decision.</span>" },
      { p: 6, ans: "Focus on stability", text: "After years of planning expeditions around uncertain weather and seasonal work, some experienced climbers begin to value what they once considered ordinary. A reliable income, regular time with family, and a permanent home may offer a form of satisfaction that constant movement cannot provide. This does not necessarily mean abandoning adventure. <span class='key-hint'>Rather, it reflects a shift toward building a life in which occasional risk is supported by dependable routines and long-term commitments.</span>" },
      { p: 7, ans: "Intimate relationships", text: "A difficult ascent can expose qualities that remain hidden in everyday life. Partners must decide whether to share equipment, slow down for one another, admit fear, and accept help without resentment. <span class='key-hint'>When these decisions are handled with honesty, the experience can create a level of trust that ordinary social occasions rarely produce.</span> The mountain is important less as a romantic setting than as a demanding environment in which care, patience, and reliability become impossible to fake." }
    ]
  },
  {
    id: 2, title: "2. The Arrival of the Four-Day Work Week (2026)", priority: true, meaning: "Sự xuất hiện của tuần làm việc 4 ngày",
    chainEn: "Outdated → Benefits → Costs → Challenges → Habits → Unfairness → Alternatives",
    chainVi: "Lỗi thời → Lợi ích → Chi phí → Thách thức → Thói quen cũ → Bất công → Giải pháp thay thế",
    paragraphs: [
      { p: 1, ans: "A way of life now out of date", text: "The familiar Monday-to-Friday timetable emerged from an industrial world in which output was closely connected to time spent beside a machine. Much contemporary work is organized differently: teams collaborate across locations, software completes routine tasks, and results can matter more than visible attendance. Keeping the same pattern simply because it is familiar may therefore be inefficient. <span class='key-hint'>The current debate asks whether a schedule designed for an earlier economy still suits organizations whose work, technology, and employees have changed substantially.</span>" },
      { p: 2, ans: "Benefits for employees", text: "An additional non-working day gives staff room to deal with appointments, domestic tasks, and recovery without using annual leave. Some return with greater concentration because they have had enough time to rest rather than spending the weekend catching up on obligations. Families may also coordinate childcare more easily, and staff gain more control over their lives. <span class='key-hint'>These improvements can strengthen morale and reduce the temptation to seek another job, even when total pay remains unchanged.</span>" },
      { p: 3, ans: "Undesirable financial consequences", text: "A reduced schedule does not automatically reduce the number of customers, patients, or calls that an organization must handle. To maintain coverage, an employer may need overlapping teams, additional recruitment, or overtime payments. Smaller firms with narrow profit margins may find these arrangements difficult to absorb. If wages are cut instead, staff carry the cost; if prices rise, customers do. <span class='key-hint'>The model can therefore create expenses that are easy to overlook when attention is focused only on its social appeal.</span>" },
      { p: 4, ans: "Unforeseen challenges for employees", text: "<span class='key-hint'>When five days of tasks are compressed into four, the timetable may become more intense rather than more efficient.</span> Meetings are placed closer together, messages accumulate during the extra day off, and delays occur when partner organizations follow a different schedule. Employees who need quiet time for complex work may discover that every available hour has been filled. These effects are not always visible during a short trial, but they can emerge once unusual deadlines, absences, and seasonal demand test the new arrangement." },
      { p: 5, ans: "Difficult to change old habits", text: "<span class='key-hint'>Changing the calendar is easier than changing assumptions about what a committed employee looks like.</span> Some managers continue to trust people they can see at a desk, while workers may feel guilty for leaving after completing their tasks. Families and transport arrangements are also built around familiar hours. Even when evidence supports a new pattern, routines developed over many years can make it feel risky or improper. Successful adoption therefore depends on changing expectations as well as updating contracts." },
      { p: 6, ans: "Unfair for some people", text: "A software company may close on Friday with little disruption, but a hospital, hotel, transport service, or shop cannot simply stop serving the public. Employees in these sectors might receive fewer advantages or be asked to work longer shifts while office staff enjoy an extra day away. Differences also arise between salaried and hourly workers. <span class='key-hint'>Unless the policy is carefully designed, a reform presented as progress could widen existing divisions between occupations and employment conditions.</span>" },
      { p: 7, ans: "Alternative solutions worth considering", text: "Organizations do not have to choose between the traditional timetable and one fixed replacement. Some allow staff to select different days away, others shorten each working day, and certain teams alternate their schedules so that services remain available. Seasonal arrangements may also suit businesses whose workload changes during the year. <span class='key-hint'>Testing several models can preserve the advantages of greater control and recovery without forcing every workplace to operate according to a pattern that ignores its particular demands.</span>" }
    ]
  },
  {
    id: 3, title: "3. Women Mathematicians. (2026)", priority: true, meaning: "Các nữ nhà toán học",
    chainEn: "Hidden by gender → Pioneer recognized → Male credited → Long career → Labels → Gender balance → Uniformity limits",
    chainVi: "Thành tựu bị che khuất vì giới → Ghi nhận người tiên phong → Nam giới được ghi công → Sự nghiệp dài → Nhãn mác → Cân bằng giới → Đồng nhất không luôn tốt",
    paragraphs: [
      { p: 1, ans: "Gender obscure achievements", text: "<span class='key-hint'>For centuries, the achievements of women in mathematics were either omitted from historical records or attributed to male colleagues.</span> Hypatia of Alexandria, one of the earliest known female mathematicians, was respected in her time, yet many of her contributions were later credited to male scholars. Such erasure has been a recurring theme in the history of women in this field." },
      { p: 2, ans: "Acknowledging achievement of a pioneer", text: "Emmy Noether, often described as the most important woman in the history of mathematics, revolutionized abstract algebra and theoretical physics. <span class='key-hint'>Albert Einstein referred to her work as \"the very expression of the spirit of modern algebra.\" Only recently has her legacy gained the widespread recognition it deserves, demonstrating a growing effort to acknowledge those once overlooked.</span>" },
      { p: 3, ans: "Man unfairly credited", text: "In many historical accounts, the success of male mathematicians has overshadowed the collaborative efforts of their female peers. <span class='key-hint'>For example, the development of chaos theory often credits Edward Lorenz, yet contributions by female mathematicians working in the same field are frequently omitted from textbooks and academic narratives.</span>" },
      { p: 4, ans: "A long career showing exceptional ability", text: "<span class='key-hint'>Mary Cartwright had a mathematical career spanning over six decades.</span> Her work in nonlinear differential equations laid the groundwork for chaos theory, influencing both mathematics and engineering. Despite the challenges faced by women in academia during her time, she maintained a consistent output of high-quality research throughout her life." },
      { p: 5, ans: "Labels can change perspective on people", text: "<span class='key-hint'>When female mathematicians are described as \"women geniuses\" or \"female prodigies,\" the gender label, while well-intended, often implies that excellence is rare among women.</span> Such terms, though celebratory, can unintentionally reinforce the idea that women's success in mathematics is unusual, rather than simply the result of talent and hard work." },
      { p: 6, ans: "Attempting to create a gender balance", text: "To address the gender imbalance in mathematics, many universities and organizations now run outreach programs, offer scholarships specifically for women, and encourage female mentorship in STEM fields. <span class='key-hint'>These efforts aim not to give unfair advantage, but to create equal opportunities in a domain where women have historically been underrepresented.</span>" },
      { p: 7, ans: "Uniformity is not always beneficial", text: "In efforts to level the playing field, some institutions have implemented standardized criteria for admissions or research evaluation. However, such uniform methods can sometimes ignore the diverse paths and challenges faced by individuals, particularly women balancing academic and societal expectations. <span class='key-hint'>A one-size-fits-all approach may not always foster true equity.</span>" }
    ]
  },
  {
    id: 4, title: "4. Digital innovation (2026)", priority: false, meaning: "Đổi mới số",
    chainEn: "Leisure → Connectivity → Digital literacy → Screen risks → Privacy → Inclusive communities → Human-friendly design",
    chainVi: "Giải trí → Kết nối → Kỹ năng số → Rủi ro màn hình → Quyền riêng tư → Cộng đồng hòa nhập → Thiết kế thân thiện",
    paragraphs: [
      { p: 1, ans: "Redefining Leisure in the Digital era", text: "Leisure was once separated fairly clearly from work and study: people left the workplace, met friends, played sport, or settled down with a book. Connected devices have blurred those boundaries. A person may watch a series while replying to colleagues, compete with strangers in an online game, or learn a skill through short videos. <span class='key-hint'>Time off has become more personalized and available on demand, but it is also more fragmented and less clearly protected from other obligations.</span>" },
      { p: 2, ans: "Enhancing connectivity with mobile apps", text: "Distance no longer requires people to wait for a letter or arrange an expensive international call. A family can maintain an ongoing group conversation across several time zones, while colleagues can exchange voice notes, documents, and live video from different countries. These exchanges are not identical to meeting in person, and constant contact can sometimes feel demanding. <span class='key-hint'>Even so, portable software has made relationships easier to maintain when regular face-to-face contact is impossible.</span>" },
      { p: 3, ans: "Promoting essential digital literacy", text: "Knowing where to tap on a screen is no longer enough for effective participation in modern society. <span class='key-hint'>Online users must judge whether a source is reliable, recognize manipulated content, manage passwords, understand what information they are giving away, and communicate without causing harm.</span> These abilities affect schoolwork, employment, banking, and access to public services. People who lack them may own modern devices yet still be excluded from many of the opportunities those devices appear to provide." },
      { p: 4, ans: "Risks of Excessive Screen-Based Entertainment", text: "Many online services are designed to remove natural stopping points. One episode begins after another, games offer continuous rewards, and feeds supply new content whenever the screen is refreshed. As a result, users may continue far longer than they intended. The cost is not limited to lost time: late-night use can disturb sleep, prolonged sitting replaces movement, and online contact may crowd out richer social experiences. <span class='key-hint'>Enjoyment becomes a problem when the design of the service makes moderation unusually difficult.</span>" },
      { p: 5, ans: "Concerns About Data Privacy", text: "A weather application may request location access, while a shopping site records searches, purchases, and the time spent viewing each product. Individually, these details can seem harmless; combined over months, they reveal routines, preferences, and likely future behavior. Most users never see the profiles built from this information or the companies with which it is exchanged. <span class='key-hint'>The central issue is therefore not simply what people choose to post, but what is gathered quietly while they use ordinary services.</span>" },
      { p: 6, ans: "Building Inclusive and Respectful Online Communities", text: "Bringing people from different backgrounds into the same online space does not automatically make that space welcoming. New members may leave when jokes rely on stereotypes, aggressive voices dominate discussion, or reporting systems fail to protect those being targeted. Clear rules, active moderation, accessible features, and a willingness to listen are therefore essential. <span class='key-hint'>Diversity can be sustained only when participation feels safe and when disagreement does not become a reason to exclude or humiliate others.</span>" },
      { p: 7, ans: "Prioritize human-friendly designs", text: "A product may contain advanced technology and still be frustrating to use. Small text, unclear symbols, crowded menus, or steps that depend on perfect vision and movement can turn a simple task into an obstacle. Effective development begins by observing a wide range of users rather than expecting everyone to adapt to the system. <span class='key-hint'>When complexity is hidden, instructions are clear, and different abilities are considered, sophisticated tools can feel simple without becoming less powerful.</span>" }
    ]
  },
  {
    id: 5, title: "5. Tech Forward (2026)", priority: false, meaning: "Công nghệ hướng tới tương lai",
    chainEn: "Interaction → Automation → Education → Overreliance → Access gap → Communities → Sustainability",
    chainVi: "Tương tác → Tự động hóa → Giáo dục → Phụ thuộc công nghệ → Khoảng cách tiếp cận → Cộng đồng → Bền vững",
    paragraphs: [
      { p: 1, ans: "Redefining human-technology interaction", text: "Keyboards and touchscreens once defined most contact with digital devices. Increasingly, systems respond to spoken requests, body movement, gaze, and facial expression. These methods can reduce the distance between intention and action: a driver can request directions without looking away from the road, while a person with limited hand movement can control equipment independently. <span class='key-hint'>As interfaces become less dependent on technical commands, using a machine begins to resemble communicating with another participant rather than operating a complicated tool.</span>" },
      { p: 2, ans: "Enhancing productivity through smart automation", text: "In many offices, valuable time is consumed by copying information between systems, sorting routine requests, and preparing standard reports. <span class='key-hint'>Software can now complete much of this work continuously and with fewer simple errors.</span> The greatest gain does not come merely from doing the same tasks faster. It comes from allowing employees to spend more attention on judgment, design, negotiation, and unusual cases—activities in which experience and creativity matter more than repetition." },
      { p: 3, ans: "Promoting tech-driven education programs", text: "Schools once treated computing as a specialist subject for a small group of students. <span class='key-hint'>It is now appearing across the curriculum: pupils may program sensors in science, analyze large data sets in geography, or build simple machines in design classes.</span> Such activities teach more than the operation of current devices. They require learners to break problems into steps, test assumptions, and improve a solution after failure, preparing them for occupations that may not yet have familiar names." },
      { p: 4, ans: "Overreliance on digital interfaces", text: "Convenient interfaces reduce effort, but they can also remove useful forms of practice. Navigation software may weaken people's awareness of their surroundings, automatic suggestions can replace careful writing, and constant switching between notifications makes sustained attention harder. The concern is not that screens are inherently harmful. <span class='key-hint'>It is that handing every small decision to a device may gradually reduce confidence and ability when the device is absent, inaccurate, or unable to understand an unfamiliar situation.</span>" },
      { p: 5, ans: "Concerns about technology access disparities", text: "A public service may move online because digital delivery is cheaper and faster for most citizens. Yet the change can disadvantage households with unreliable connections, shared phones, limited data, or little confidence using formal websites. The same barrier affects applications for work, access to lessons, and medical appointments. <span class='key-hint'>Providing a device alone is rarely sufficient; affordable connections, accessible services, technical support, and safe places to use them are all necessary if technological progress is not to deepen existing inequality.</span>" },
      { p: 6, ans: "Building innovative tech communities", text: "Many successful projects begin outside formal companies or universities. Enthusiasts meet in local workshops, online forums, or volunteer groups to exchange code, lend equipment, and challenge one another's ideas. A beginner may receive guidance from an experienced engineer, while a researcher discovers an unexpected use for an unfinished prototype. <span class='key-hint'>These networks are valuable because knowledge moves freely across occupations and age groups, allowing promising ideas to develop before they attract money or institutional support.</span>" },
      { p: 7, ans: "Focusing on sustainable digital solutions", text: "The environmental cost of a digital product is often hidden behind its clean screen. Devices require mined materials, data centers consume large amounts of electricity, and frequent upgrades create difficult waste. <span class='key-hint'>Some firms are responding by extending software support, designing products that can be repaired, reusing components, and powering infrastructure with lower-carbon energy.</span> The aim is not to stop technological progress, but to judge innovation partly by how long it lasts and what resources it consumes throughout its life." }
    ]
  },
  {
    id: 6, title: "6. Consumer (2026)", priority: false, meaning: "Người tiêu dùng / lối sống tiêu dùng",
    chainEn: "Last longer → Experiment → Secrecy → Relevance → Generosity → Compromise → Lessons",
    chainVi: "Dùng bền hơn → Thử nghiệm → Giữ bí mật → Vẫn phù hợp → Khó cho đi → Thỏa hiệp → Bài học",
    paragraphs: [
      { p: 1, ans: "Making things last longer", text: "In today's modern consumer age, people tend to own more than they used to. A worker only has 5-6 pairs of shoes in his entire life. <span class='key-hint'>And he will repair them when they break or wear out, not throw them away.</span> Nowadays, if we have a phone, it is expected that you will use such electronic devices throughout your life." },
      { p: 2, ans: "A temporary experiment", text: "<span class='key-hint'>Mrs. Judith Levine - a journalist and her husband decided to change their lifestyle to be as minimalist as possible.</span> They only buy what is absolutely necessary, such as food for work. They do not go to the cinema, cafes, restaurants. As a writer, I can say that she is saving for a purpose of publishing her findings as a book." },
      { p: 3, ans: "The reason of secrecy", text: "To make this experiment as realistic as possible, Ms. Levine and her husband decided not to tell anyone, because they knew that once their friends knew about this plan, they would mention the issue of paying for the couple's share when they went out together. <span class='key-hint'>Therefore, the couple was determined to keep it a secret from friends, family and strangers.</span>" },
      { p: 4, ans: "Still relevant to our times", text: "Published in 2006, the book Not Buying It when reread 10 years later still holds its value. They believe that journalist Ms. Levine has the ability to predict future consumer trends. <span class='key-hint'>The minimalist lifestyle she mentioned has become a trend today.</span>" },
      { p: 5, ans: "The difficulty of being generous", text: "<span class='key-hint'>The couple wanted to buy a gift as a gift. However, that went against their point of not buying unnecessary things.</span> And they decided to make it themselves to have a lower spending level. However, none of them have any aesthetic talent, so <span class='key-hint'>they finally decided to give a meaningful and practical gift to the recipient,</span> which is a piece of their jewelry." },
      { p: 6, ans: "Reason to reach a compromise", text: "<span class='key-hint'>Ms. Levine does not have an office, which is quite inconvenient when she has to meet partners in a coffee shop. When working alone, she often goes to the public library and finds it very convenient.</span>" },
      { p: 7, ans: "Important lessons for all of us", text: "<span class='key-hint'>Lessons about minimalism in today's consumer trends: buy things that are really necessary, switch from driving cars and motorbikes to cycling and walking.</span>" }
    ]
  },
  {
    id: 7, title: "7. Wellness Trends. (2026)", priority: false, meaning: "Xu hướng chăm sóc sức khỏe",
    chainEn: "Holistic health → Mental health → Community fitness → Trendy diets → Misinformation → Support → Sustainable habits",
    chainVi: "Sức khỏe toàn diện → Sức khỏe tinh thần → Vận động cộng đồng → Ăn kiêng theo trào lưu → Tin sai → Hỗ trợ cộng đồng → Thói quen bền vững",
    paragraphs: [
      { p: 1, ans: "Redefining holistic health approaches", text: "A person may follow an excellent exercise plan and still feel unwell because of persistent stress, poor sleep, isolation, or an unsuitable working environment. Treating each complaint separately can miss the way these factors influence one another. <span class='key-hint'>A broader view examines daily routines, emotional pressures, relationships, nutrition, and surroundings alongside physical symptoms.</span> Its value lies less in offering one universal cure than in understanding why several modest changes, made together, may produce a more lasting improvement." },
      { p: 2, ans: "Promoting mental health awareness", text: "<span class='key-hint'>Silence surrounding anxiety, depression, and severe stress often delays assistance until problems interfere with work, study, or relationships.</span> Public campaigns, classroom discussions, and personal accounts can make the subject easier to name without shame. Their purpose is not to encourage casual self-diagnosis, but to help people notice warning signs, respond compassionately, and know where professional support is available. Earlier conversation can prevent isolation and make seeking help appear responsible rather than exceptional." },
      { p: 3, ans: "Encouraging community fitness programs", text: "Exercise advice is easy to give but difficult to follow when activity feels lonely, expensive, or disconnected from daily life. <span class='key-hint'>Walking groups, public dance sessions, neighborhood sports, and low-cost classes change that experience by adding routine and companionship.</span> Participants often return because others expect them, not because their motivation is always strong. In this setting, movement becomes a social habit rather than a private test of willpower, making continued participation more likely among people who would not join a conventional gym." },
      { p: 4, ans: "Overemphasis on trendy diets", text: "Popular eating plans often gain attention by identifying one ingredient as the cause of poor health and promising rapid results when it is removed. Early weight loss may reinforce the claim, even when it mainly reflects water loss or a temporary reduction in calories. Over time, strict rules can create nutrient gaps, anxiety about food, and repeated cycles of failure. <span class='key-hint'>A less dramatic approach—varied meals, appropriate portions, and habits suited to the individual—is usually harder to advertise but easier to maintain.</span>" },
      { p: 5, ans: "Concerns about wellness misinformation", text: "Advice about health travels quickly online because personal stories are more memorable than cautious scientific explanations. A confident influencer may recommend a supplement after one positive experience, while an alarming video presents coincidence as proof of harm. Repetition can make such claims appear established even when supporting evidence is weak. <span class='key-hint'>Readers therefore need to check who produced the information, whether independent research agrees, and whether a qualified professional should be consulted before the advice changes treatment or diet.</span>" },
      { p: 6, ans: "Building supportive health communities", text: "Long-term change rarely follows a smooth path. Someone trying to sleep better, exercise regularly, or recover from illness may lose motivation after a setback and assume that previous progress has been wasted. <span class='key-hint'>Groups of people facing similar challenges can provide perspective, practical suggestions, and a reason to continue.</span> Their most useful contribution is often not expert instruction but the reassurance that difficulties are normal and that improvement can be measured over months rather than judged by a single bad week." },
      { p: 7, ans: "Focusing on sustainable lifestyle changes", text: "Dramatic resolutions often disappear once the initial excitement fades. A routine is more likely to survive when it fits ordinary life: a slightly earlier bedtime, meals that can be prepared on busy days, short periods of movement, and realistic methods of handling pressure. These changes may seem too small to produce immediate transformation, yet their effects accumulate because they can be repeated. <span class='key-hint'>Lasting health is usually built through adjustments that remain possible during stressful as well as ideal weeks.</span>" }
    ]
  },
  {
    id: 8, title: "8. Eating (2026)", priority: false, meaning: "Ẩm thực Trung Hoa",
    chainEn: "Origins → Philosophy → Regions → Cooking → Eating style → Diet changes → Effects",
    chainVi: "Nguồn gốc → Triết lý → Vùng miền → Cách nấu → Cách ăn → Thay đổi chế độ ăn → Tác động",
    paragraphs: [
      { p: 1, ans: "The origins of chinese food", text: "Chinese culinary culture is like most other cultures in the world. <span class='key-hint'>It started with very basic hunting and gathering.</span> Over time, society gradually developed, and with it, culinary culture developed. Gradually, cuisine became an art form and seemed to reach its peak in the 19th century. Although most Chinese people choose simple food with rice and vegetables, it is undeniable that Chinese culinary art has reached the level of exploiting the maximum flavor and each ingredient." },
      { p: 2, ans: "The influence of philosophy", text: "<span class='key-hint'>The concept of yin and yang has a complex influence on Chinese cuisine.</span> In fact, this concept also appears in many other areas of life. It can be understood that yin and yang are opposite elements that complement each other to achieve a certain balance. Sweet and sour, cold and hot are typical examples of this concept. Some foods can be classified into hot or cold groups, such as lemon is considered cold and onion is considered hot. Based on this concept, Chinese people choose suitable foods to maintain the balance of the body." },
      { p: 3, ans: "Regional variations", text: "In addition to the concept of yin and yang directly influencing the culinary culture, the Chinese also pay close attention to the availability of ingredients. <span class='key-hint'>Each region has its own ingredients, and this leads to differences in regional cooking styles.</span> The coastal areas in the south of the country are famous for seafood dishes. In the north, the widespread cultivation of wheat has led to noodle dishes. The southwestern regions are famous for spicy soups, while some regions are famous for grilled meat." },
      { p: 4, ans: "Cooking methods", text: "<span class='key-hint'>Cooking methods are also regionally specific, in addition to the differences in food in these regions.</span> However, there are some food techniques that are considered to be standard in Chinese culture. For example, vegetables are cut into small pieces and eaten with chopsticks. The Chinese have a long history of using chopsticks. The Chinese also often leave fish and meat with bones. According to them, this makes the food more delicious. Steaming is a very popular form of cooking. In addition, frying food with cooking oil is also commonly used." },
      { p: 5, ans: "The style of eating", text: "<span class='key-hint'>The most common way for Chinese people to eat is street food.</span> It is very common to see stalls selling all kinds of food on both sides of the road. This has become a part of the food culture. <span class='key-hint'>For large dining events, the food is often placed in the middle of the table so that guests can try different dishes.</span> The meal is served with tea and sometimes rice wine from the local area." },
      { p: 6, ans: "Changes in the Chinese diets", text: "<span class='key-hint'>There are signs that Chinese food culture and eating habits are changing.</span> Chinese people now consume a wide variety of foods from many different countries. People in cities also prefer fast and convenient foods. In addition, some traditional products such as milk are consumed less by Chinese people than in the past." },
      { p: 7, ans: "Effects of a changing diet", text: "<span class='key-hint'>The change in Chinese eating habits has a global impact.</span> Due to its huge population, the food demand of the Chinese market will directly affect domestic and international food production. The change in diet leads to problems such as the increase in related diseases that a large economy like China is prone to. Therefore, achieving a balance like the yin-yang philosophy in Chinese culinary culture is clearly a big challenge." }
    ]
  },
  {
    id: 9, title: "9. Frozen land (2025)", priority: false, meaning: "Vùng đất băng giá",
    chainEn: "Governance → First landing → End of Earth → Hidden landscape → Pole race → Easier travel → Cold reasons",
    chainVi: "Quản lý → Bước chân đầu tiên → Tận cùng Trái Đất → Địa hình dưới băng → Cuộc đua tới cực → Di chuyển dễ hơn → Lý do lạnh",
    paragraphs: [
      { p: 1, ans: "Who is in charge?", text: "Although Antarctica is not claimed as a country, several nations have laid territorial claims over parts of the continent. However, under the Antarctic Treaty System signed in 1959, no single country has full ownership. <span class='key-hint'>Instead, the region is governed collectively by over 50 countries that have agreed to preserve it for peaceful and scientific purposes.</span> No military activity is allowed, and scientific cooperation is encouraged. This unique model of international governance helps protect the fragile environment of the frozen land and ensures that its resources are not exploited for commercial gain." },
      { p: 2, ans: "First step on the ice", text: "The first known landing on Antarctica took place in the early 19th century when a group of seal hunters unintentionally arrived at the icy coastline. Later, exploratory missions were organized specifically to set foot on the continent. In 1895, a Norwegian expedition became the first officially recognized landing. <span class='key-hint'>These early steps were dangerous and uncertain, with little knowledge of the terrain or weather.</span> Still, the achievement marked a turning point in human exploration, showing that even the most remote and inhospitable places on Earth could be reached with courage and persistence." },
      { p: 3, ans: "Where is the end of the Earth?", text: "<span class='key-hint'>Antarctica has often been described as the end of the Earth.</span> Located at the southernmost point of the planet, it remains one of the most mysterious and least accessible places for humans. It's surrounded by the Southern Ocean and sits opposite the Arctic in the global geography. For centuries, explorers speculated whether such a place existed at all. Today, while satellite images and scientific missions provide more data, the continent still retains an aura of the unknown, attracting adventurers and scientists who want to experience the planet's final frontier." },
      { p: 4, ans: "The hidden landscape beneath the ice", text: "<span class='key-hint'>Despite being covered in thick sheets of ice, Antarctica has a surprisingly diverse and dramatic landscape hidden beneath its surface.</span> Using ground-penetrating radar and satellite imaging, scientists have discovered vast mountain ranges, deep valleys, and even ancient lakes buried under kilometers of ice. These findings suggest that Antarctica was once a very different environment. Studying this hidden geography helps researchers understand the Earth's geological past, as well as how changes in climate may affect the region's ice coverage in the future." },
      { p: 5, ans: "Race to the pole", text: "The early 20th century saw a dramatic competition between nations to reach the South Pole. Most famously, British explorer Robert Falcon Scott and Norwegian Roald Amundsen led rival expeditions. Amundsen reached the Pole first in 1911, using dog sleds and careful planning. Scott arrived weeks later, only to perish on the return journey with his team. <span class='key-hint'>The race to the pole was one of the most extreme tests of human endurance and remains one of the most iconic chapters in the history of polar exploration.</span>" },
      { p: 6, ans: "Less effort needed", text: "Travel across Antarctica remains one of the most difficult journeys on Earth. <span class='key-hint'>However, modern technology has significantly reduced the physical effort required.</span> In the past, explorers dragged heavy sleds by hand or used animals, often in dangerous and freezing conditions. Today, snowmobiles, tracked vehicles, and even aircraft allow researchers to move equipment and people more easily. While the environment is still harsh, advances in transportation and survival gear make scientific missions more efficient and less life-threatening than those of early explorers." },
      { p: 7, ans: "Why is it so cold?", text: "<span class='key-hint'>Antarctica is the coldest place on Earth, with temperatures regularly dropping below –60°C in winter.</span> The continent's high altitude, its position near the South Pole, and the fact that sunlight is absent for months all contribute to its extreme chill. Its white ice surface also reflects most of the sun's heat back into the atmosphere. These unique features make it difficult for heat to accumulate, and as a result, the region remains frozen even in summer. Understanding these conditions helps scientists study global weather patterns and climate change." }
    ]
  },
  {
    id: 10, title: "10. Meatless (2026)", priority: false, meaning: "Chế độ ăn không thịt",
    chainEn: "Types → Reasons → Feasibility → Factory-farming harm → Respect life → Health → Global responsibility",
    chainVi: "Các loại → Lý do → Có thể thực hiện → Tác hại chăn nuôi công nghiệp → Tôn trọng sự sống → Sức khỏe → Trách nhiệm toàn cầu",
    paragraphs: [
      { p: 1, ans: "Types of Vegetarian", text: "<span class='key-hint'>Vegetarianism is not a single dietary choice but includes many different forms.</span> Some vegetarians avoid meat but still eat dairy and eggs—these are called lacto-ovo vegetarians. Others, like vegans, avoid all animal-derived products, including honey and gelatin. There are also pescatarians, who exclude meat but still consume fish. Flexitarians mostly eat plant-based foods but occasionally include meat or fish. These variations show that a meatless diet can be adapted to individual needs and beliefs, making it a flexible and increasingly popular choice for people around the world." },
      { p: 2, ans: "Various explanations", text: "<span class='key-hint'>People adopt meatless diets for many different reasons.</span> For some, religious beliefs guide their eating habits, while others avoid meat out of concern for animal welfare. Some are motivated by environmental issues, believing that reducing meat consumption lowers their carbon footprint. Health is also a major factor, as some studies link vegetarian diets to lower risks of heart disease and diabetes. The motivations are as varied as the people who choose them, and it's not uncommon for individuals to follow a plant-based lifestyle for a combination of reasons." },
      { p: 3, ans: "Possible to happen", text: "Many people wonder if it's truly possible to live without eating meat. <span class='key-hint'>The answer is yes, as proven by millions of vegetarians and vegans worldwide.</span> While it requires some planning to ensure a balanced intake of protein, iron, and vitamin B12, plant-based diets can be nutritionally complete. In fact, major health organizations have stated that well-planned vegetarian and vegan diets are suitable for all stages of life, including childhood and pregnancy. With a variety of plant-based options now available, choosing a meatless lifestyle is more practical than ever." },
      { p: 4, ans: "Factory farming - it is a harmful thing", text: "<span class='key-hint'>Factory farming—the industrialized method of raising animals for food—has been criticized for its negative effects on both animals and the environment.</span> Animals are often kept in cramped, stressful conditions, and the use of antibiotics to promote growth raises concerns about resistance. Additionally, factory farms contribute to pollution and greenhouse gas emissions. These harmful impacts are among the key reasons why some people choose to reduce or eliminate meat from their diet. Supporting ethical and sustainable food sources is becoming a growing priority for many consumers." },
      { p: 5, ans: "Respect the life", text: "<span class='key-hint'>At the core of many vegetarian beliefs is the idea of respecting all forms of life.</span> For some, avoiding meat is a moral decision rooted in the belief that animals have the right to live without suffering. This perspective emphasizes empathy, compassion, and non-violence. It is also reflected in certain spiritual or religious practices where harming living beings is discouraged. Choosing a meatless diet becomes more than just a personal choice—it represents a commitment to treating all creatures with dignity and care." },
      { p: 6, ans: "Health gets better with diet", text: "A common benefit reported by people who switch to a plant-based diet is improved health. <span class='key-hint'>Many experience lower cholesterol levels, better digestion, and increased energy.</span> Vegetarian diets are often rich in fiber, antioxidants, and healthy fats. Studies show that people who consume more fruits, vegetables, whole grains, and legumes tend to have lower risks of heart disease and obesity. However, balance is key—a diet full of processed plant foods can still be unhealthy. When done right, a meatless diet can be a strong foundation for a healthy lifestyle." },
      { p: 7, ans: "Our responsibilities for global", text: "<span class='key-hint'>Reducing meat consumption can also be seen as a global responsibility.</span> Livestock farming is a major contributor to climate change, water usage, and deforestation. By choosing plant-based options, individuals can lower their environmental impact and support a more sustainable food system. Small changes made by many people can have a big collective effect. From conserving water to reducing greenhouse gas emissions, a meatless diet can be a meaningful step toward addressing some of the planet’s most urgent environmental challenges." }
    ]
  },
  {
    id: 11, title: "11. Music (2026)", priority: false, meaning: "Âm nhạc",
    chainEn: "Physical → Memory → Social → Discipline → Emotion → Empathy → Well-being",
    chainVi: "Thể lực → Trí nhớ → Giao lưu → Kỷ luật → Cảm xúc → Đồng cảm → Sức khỏe tinh thần",
    paragraphs: [
      { p: 1, ans: "A physically demanding activity", text: "While music is often associated with emotional expression, playing certain instruments can be surprisingly physical. Percussionists, drummers, and even pianists require strong coordination, stamina, and posture. Marching band musicians must walk in sync for long hours, often while carrying heavy instruments. String players need muscular endurance in their fingers and arms, and wind instrument players must have good lung capacity. <span class='key-hint'>Practicing regularly and performing under pressure also places physical demands on the body.</span> In this way, music isn’t only mentally engaging—it can also be quite the workout." },
      { p: 2, ans: "A good way to boost your memory", text: "<span class='key-hint'>Scientific studies have shown that learning to play music strengthens memory.</span> When musicians play, they must recall notes, rhythms, and sequences, sometimes in real-time. Reading sheet music while coordinating hands or breath with timing challenges the brain, forming new neural pathways. This mental exercise has even been linked to improved academic performance in children and better memory retention in older adults. Whether memorizing entire pieces or remembering finger positions, the mental workout of music can benefit cognitive health across all age groups." },
      { p: 3, ans: "A great opportunity to broaden your social circle", text: "Music often brings people together, whether in choirs, orchestras, or bands. <span class='key-hint'>Being part of a musical group requires teamwork and offers regular opportunities to meet new people.</span> This shared experience fosters a strong sense of community and belonging. For many, joining a music class or ensemble is not just about performance, but also about making friends and socializing in a relaxed, collaborative setting. Over time, these connections can turn into lasting friendships, broadening one's personal and professional network." },
      { p: 4, ans: "Developing self-discipline through music", text: "Learning music requires dedication and routine. <span class='key-hint'>Students must practice regularly, attend rehearsals, and develop time management skills to balance music with other responsibilities.</span> This structure helps build self-discipline and patience. Mastering an instrument takes months, even years, and involves repeating scales, fixing mistakes, and gradually improving. These habits transfer to other areas of life, helping musicians stay focused and committed to long-term goals. Music teaches that progress comes through consistency and effort over time." },
      { p: 5, ans: "A creative outlet for expressing emotions", text: "For many people, music is a deeply emotional experience. It offers a unique and personal way to express feelings that may be difficult to put into words. Composing melodies, writing lyrics, or simply playing with passion allows individuals to explore their emotional world and communicate it with others. Music can reflect joy, sadness, hope, or frustration. For this reason, it is often used in therapy to help people process emotions. <span class='key-hint'>In creative expression, music becomes both an emotional release and a form of personal storytelling.</span>" },
      { p: 6, ans: "Enhanced sensitivity to other people's feelings", text: "<span class='key-hint'>Musicians often develop a heightened awareness of other people’s emotional states.</span> In group settings, they must listen carefully and respond to changes in tone, tempo, or mood. This sensitivity helps them stay in harmony with others, both musically and socially. Playing music with others encourages empathy and understanding. Over time, this experience fosters emotional intelligence—a skill that benefits communication, relationships, and social awareness in everyday life." },
      { p: 7, ans: "Develop a greater sense of well-being", text: "Many people report feeling happier and more balanced when music is part of their daily life. Playing or listening to music can reduce stress, improve mood, and create a sense of inner peace. It provides a break from daily routines and offers something meaningful to focus on. Some use music to relax before bed, while others rely on it to energize their mornings. <span class='key-hint'>The emotional and psychological benefits are powerful, making music a simple yet effective tool for personal well-being.</span>" }
    ]
  },
  {
    id: 12, title: "12. Tulips (2026)", priority: false, meaning: "Hoa tulip",
    chainEn: "Golden economy → Fashion → Trade object → Varieties → Trade mechanics → Europe → Collapse",
    chainVi: "Kinh tế Thời Hoàng kim → Thời thượng → Hàng hóa → Các giống tulip → Cơ chế giao dịch → Châu Âu → Sụp đổ bất ngờ",
    paragraphs: [
      { p: 1, ans: "The economy during the Golden Age", text: "In the 17th century, Amsterdam was a prosperous city in the Netherlands. Besides, the Netherlands experienced a period of immense wealth and cultural development. Trade, science, and the arts flourished, creating a thriving middle class with disposable income. This prosperity led to a growing interest in luxury items, including rare flowers such as tulips. <span class='key-hint'>The booming economy encouraged speculative investments, and tulips quickly became a symbol of wealth and social status.</span> Their rising popularity was not merely about beauty but about prestige—owning exotic tulips was a way to showcase one's success in this golden era." },
      { p: 2, ans: "Coming into fashion", text: "Tulips first gained popularity in the Ottoman Empire and later spread to Western Europe. When they arrived in the Netherlands, they became an instant sensation. Their bold colors and unique shapes captivated people, and soon tulips were planted in aristocratic gardens and depicted in still-life paintings. The flower’s visual appeal made it highly desirable among the wealthy and artistic communities. <span class='key-hint'>By the early 1600s, tulips had become one of the most fashionable items in Dutch society, and their fame began to outshine other plants traditionally valued in Europe.</span>" },
      { p: 3, ans: "An object of trade", text: "<span class='key-hint'>As their popularity increased, tulips transitioned from decorative items to commodities.</span> They began to be sold in markets, sometimes even before they had bloomed. Merchants treated tulip bulbs like valuable assets, often purchasing them based on future availability. Buyers and sellers exchanged contracts instead of the actual flowers, betting on future prices. This speculative behavior turned the tulip into more than just a flower—it became a financial instrument, with its value fluctuating daily based on market trends and demand." },
      { p: 4, ans: "Different types of tulip", text: "<span class='key-hint'>There are hundreds of tulip varieties, differing in color, shape, and pattern.</span> Some of the most prized tulips during the 17th century were those with unique stripes or flame-like markings on their petals. These effects were later discovered to be caused by a virus affecting the flower, but at the time they were considered extremely rare and beautiful. Breeders carefully cultivated new hybrids, and collectors paid large sums for bulbs with unusual appearances. This diversity in types helped fuel the tulip craze, as people competed to own the most exotic specimens." },
      { p: 5, ans: "Trade mechanics", text: "<span class='key-hint'>The tulip trade operated on a complex system of contracts, options, and informal agreements.</span> Because bulbs bloom only once a year, buyers often agreed on future purchases, sometimes without even seeing the flower. Specialized markets were established where traders could buy and sell tulip futures. Prices were agreed upon months in advance, and payments were made when the bulbs were delivered. This abstract trading model made it easier for speculators to participate, but it also disconnected the trade from the real value of the product itself." },
      { p: 6, ans: "Trade across Europe", text: "Tulip trading wasn’t limited to the Netherlands. <span class='key-hint'>As demand grew, bulbs were shipped across Europe—from France to England and beyond.</span> Traders carried these rare goods by land and sea, navigating a web of routes and tariffs. Each region had its own preferences, and what was fashionable in Amsterdam might not be as popular in Paris. Nonetheless, tulips remained a desirable item among European elites, and international trade routes helped spread both the flower and its financial influence across the continent." },
      { p: 7, ans: "An Unexpected turn of events", text: "<span class='key-hint'>The tulip market collapsed suddenly in 1637.</span> After years of increasing prices and wild speculation, confidence disappeared overnight. Buyers stopped showing up to auctions, and contracts became worthless. Panic spread, and traders who had invested heavily were left with massive debts and unsellable bulbs. This event, often referred to as the first economic bubble in history, highlighted the dangers of speculative markets. The tulip crash left a deep impact on the Dutch economy and became a cautionary tale still taught in economics courses today." }
    ]
  },

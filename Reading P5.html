// ================= BỘ NHỚ AN TOÀN (KHÔNG LỖI TRÊN MỌI TRÌNH DUYỆT) =================
var srsData = {};
function loadSRS() {
    try {
        var raw = window.localStorage ? localStorage.getItem('readingP5_v2') : null;
        if (raw) srsData = JSON.parse(raw);
    } catch (e) {
        srsData = {};
    }
}
function saveSRS() {
    try {
        if (window.localStorage) localStorage.setItem('readingP5_v2', JSON.stringify(srsData));
    } catch (e) {}
    updateHeaderBadges();
}

// ================= ÂM THANH AN TOÀN =================
function stopSpeech() {
    try {
        if ('speechSynthesis' in window && window.speechSynthesis) {
            window.speechSynthesis.cancel();
        }
    } catch (e) {}
}
function speakText(text) {
    try {
        if (!('speechSynthesis' in window) || !window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-US';
        u.rate = 0.96;
        window.speechSynthesis.speak(u);
    } catch (e) {}
}
function stripHtml(html) {
    var d = document.createElement('div');
    d.innerHTML = html;
    return d.textContent || d.innerText || '';
}

// ================= BIẾN ĐIỀU KHIỂN QUIZ =================
var quizQueue = [];
var currentItem = null;
var timerInterval = null;
var timeLeft = 25;
var chainState = [null, null, null, null, null, null, null];

function getKey(tId, pNum) { return 'T' + tId + '_P' + pNum; }

function updateHeaderBadges() {
    var srsCount = 0;
    var masteredCount = 0;
    for (var k in srsData) {
        if (srsData.hasOwnProperty(k)) {
            if (srsData[k].mistakes > 0) srsCount++;
            if (srsData[k].mastered) masteredCount++;
        }
    }
    document.getElementById('srsCountBadge').textContent = 'SRS: ' + srsCount;
    document.getElementById('masteredBadge').textContent = masteredCount + '/105';
}

function initQuizQueue(specificTopicId) {
    var filter = document.getElementById('quizFilter').value;
    quizQueue = [];

    for (var i = 0; i < TOPICS.length; i++) {
        var t = TOPICS[i];
        if (specificTopicId && t.id !== specificTopicId) continue;
        if (!specificTopicId && filter === 'priority' && !t.priority) continue;

        for (var j = 0; j < t.paragraphs.length; j++) {
            var para = t.paragraphs[j];
            var key = getKey(t.id, para.p);
            var st = srsData[key] || { mistakes: 0, streak: 0, mastered: false };
            if (!specificTopicId && filter === 'mistakes' && st.mistakes === 0) continue;

            quizQueue.push({
                topic: t,
                para: para,
                key: key,
                weight: (t.priority ? 3 : 1) + (st.mistakes * 5) - (st.mastered ? 2 : 0)
            });
        }
    }

    if (quizQueue.length === 0) {
        document.getElementById('quizFilter').value = 'priority';
        initQuizQueue(null);
        return;
    }

    quizQueue.sort(function(a, b) {
        return (b.weight + Math.random() * 2) - (a.weight + Math.random() * 2);
    });
    renderQuestion();
}

function renderQuestion() {
    if (quizQueue.length === 0) {
        initQuizQueue(null);
        return;
    }
    currentItem = quizQueue[0];
    var topic = currentItem.topic;
    var para = currentItem.para;

    document.getElementById('quizCard').classList.remove('answered');
    document.getElementById('qFeedback').classList.remove('show');
    document.getElementById('qTopicName').textContent = topic.title + (topic.priority ? ' 🔥' : '');
    document.getElementById('qParaNum').textContent = 'Paragraph ' + para.p + '/7 (' + topic.meaning + ')';
    document.getElementById('qPassage').innerHTML = para.text;

    var allHeadings = [];
    for (var i = 0; i < topic.paragraphs.length; i++) {
        allHeadings.push(topic.paragraphs[i].ans);
    }
    allHeadings.sort(function() { return Math.random() - 0.5; });

    var optContainer = document.getElementById('qOptions');
    optContainer.innerHTML = '';

    for (var k = 0; k < allHeadings.length; k++) {
        (function(headingText) {
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'opt-btn';
            btn.textContent = headingText;
            btn.addEventListener('click', function() {
                checkAnswer(headingText, btn);
            });
            optContainer.appendChild(btn);
        })(allHeadings[k]);
    }

    startTimer();
    if (document.getElementById('autoAudioToggle').checked) {
        speakText(stripHtml(para.text));
    }
}

function checkAnswer(selected, btnElement) {
    if (timerInterval) clearInterval(timerInterval);
    var topic = currentItem.topic;
    var para = currentItem.para;
    var key = currentItem.key;
    var isCorrect = (selected === para.ans);

    document.getElementById('quizCard').classList.add('answered');
    var allBtns = document.querySelectorAll('#qOptions .opt-btn');
    for (var i = 0; i < allBtns.length; i++) {
        allBtns[i].disabled = true;
        if (allBtns[i].textContent === para.ans) {
            allBtns[i].classList.add('correct');
        }
    }

    if (!srsData[key]) srsData[key] = { mistakes: 0, streak: 0, mastered: false };
    var fbStatus = document.getElementById('fbStatus');

    if (isCorrect) {
        if (btnElement) btnElement.classList.add('correct');
        srsData[key].streak += 1;
        if (srsData[key].mistakes > 0) srsData[key].mistakes -= 1;
        if (srsData[key].streak >= 1 && srsData[key].mistakes === 0) srsData[key].mastered = true;

        fbStatus.innerHTML = '<span style="color:var(--success)">✅ CHÍNH XÁC! (' + para.ans + ')</span>';
        var done = quizQueue.shift();
        quizQueue.push(done);
    } else {
        if (btnElement) btnElement.classList.add('wrong');
        srsData[key].mistakes += 2;
        srsData[key].streak = 0;
        srsData[key].mastered = false;

        fbStatus.innerHTML = '<span style="color:var(--danger)">❌ SAI RỒI! Đáp án đúng: ' + para.ans + '</span><br><small style="color:var(--warn)">⚡ Câu này sẽ lặp lại sau 2 câu nữa để bạn nhớ kỹ!</small>';
        var failed = quizQueue.shift();
        var reinsertIdx = Math.min(2, quizQueue.length);
        quizQueue.splice(reinsertIdx, 0, failed);
    }

    saveSRS();
    document.getElementById('fbChain').innerHTML =
        '<div><b>Chuỗi nhớ (' + topic.title + '):</b> ' + topic.chainEn + '</div>' +
        '<div><b>Nghĩa:</b> ' + topic.chainVi + '</div>';
    document.getElementById('qFeedback').classList.add('show');

    if (document.getElementById('autoAudioToggle').checked) {
        speakText(para.ans);
    }
}

function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    var maxTime = parseInt(document.getElementById('timerSetting').value, 10);
    var timerEl = document.getElementById('qTimer');
    timerEl.classList.remove('low');

    if (maxTime === 0) {
        timerEl.textContent = '∞';
        return;
    }
    timeLeft = maxTime;
    timerEl.textContent = timeLeft + 's';
    timerInterval = setInterval(function() {
        timeLeft--;
        timerEl.textContent = timeLeft + 's';
        if (timeLeft <= 5) timerEl.classList.add('low');
        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            checkAnswer(null, null);
        }
    }, 1000);
}

// ================= NHỚ CHUỖI P1 -> P7 =================
function initChainSelect() {
    var sel = document.getElementById('chainTopicSelect');
    sel.innerHTML = '';
    for (var i = 0; i < TOPICS.length; i++) {
        var t = TOPICS[i];
        var opt = document.createElement('option');
        opt.value = t.id;
        opt.textContent = t.title + (t.priority ? ' 🔥' : '');
        sel.appendChild(opt);
    }
    loadChainDrill();
}

function getSelectedChainTopic() {
    var topicId = parseInt(document.getElementById('chainTopicSelect').value, 10) || 1;
    for (var i = 0; i < TOPICS.length; i++) {
        if (TOPICS[i].id === topicId) return TOPICS[i];
    }
    return TOPICS[0];
}

function loadChainDrill() {
    var topic = getSelectedChainTopic();
    chainState = [null, null, null, null, null, null, null];
    document.getElementById('chainMeaning').textContent = topic.title + ' — ' + topic.meaning;
    document.getElementById('chainEnHint').textContent = topic.chainEn;
    document.getElementById('chainViHint').textContent = topic.chainVi;
    renderChainUI(topic);
}

function renderChainUI(topic) {
    var slotsEl = document.getElementById('chainSlots');
    slotsEl.innerHTML = '';
    var allFilled = true;
    for (var m = 0; m < 7; m++) {
        if (chainState[m] === null) allFilled = false;
    }

    for (var i = 0; i < 7; i++) {
        (function(idx) {
            var row = document.createElement('div');
            row.className = 'slot-row';
            var numSpan = document.createElement('span');
            numSpan.className = 'slot-num';
            numSpan.textContent = 'P' + (idx + 1);

            var box = document.createElement('div');
            var val = chainState[idx];
            var statusClass = val ? 'filled' : '';
            if (val && allFilled) {
                statusClass = (val === topic.paragraphs[idx].ans) ? 'correct' : 'wrong';
            }
            box.className = 'slot-box ' + statusClass;
            box.textContent = val || 'Chạm chọn heading...';
            box.addEventListener('click', function() {
                chainState[idx] = null;
                renderChainUI(topic);
            });

            row.appendChild(numSpan);
            row.appendChild(box);
            slotsEl.appendChild(row);
        })(i);
    }

    var poolEl = document.getElementById('chainPool');
    poolEl.innerHTML = '';
    var sortedAns = [];
    for (var j = 0; j < topic.paragraphs.length; j++) {
        sortedAns.push(topic.paragraphs[j].ans);
    }
    sortedAns.sort();

    for (var k = 0; k < sortedAns.length; k++) {
        (function(ansText) {
            var chip = document.createElement('div');
            var isUsed = (chainState.indexOf(ansText) !== -1);
            chip.className = 'chip ' + (isUsed ? 'used' : '');
            chip.textContent = ansText;
            chip.addEventListener('click', function() {
                var emptyIdx = chainState.indexOf(null);
                if (emptyIdx === -1) return;
                chainState[emptyIdx] = ansText;
                speakText(ansText);
                renderChainUI(topic);
            });
            poolEl.appendChild(chip);
        })(sortedAns[k]);
    }
}

// ================= DANH SÁCH 15 CHỦ ĐỀ =================
function renderStudyList() {
    var container = document.getElementById('studyList');
    container.innerHTML = '';

    for (var i = 0; i < TOPICS.length; i++) {
        (function(t) {
            var card = document.createElement('div');
            card.className = 'card';

            var headerDiv = document.createElement('div');
            headerDiv.style.display = 'flex';
            headerDiv.style.justifyContent = 'space-between';
            headerDiv.style.alignItems = 'center';
            headerDiv.style.cursor = 'pointer';

            var titleBox = document.createElement('div');
            titleBox.innerHTML = '<div style="font-weight:700; font-size:1rem;">' + t.title + (t.priority ? ' 🔥🔥🔥🔥🔥' : '') + '</div>' +
                                 '<div style="font-size:0.85rem; color:var(--sub);">' + t.meaning + '</div>';

            var practiceBtn = document.createElement('button');
            practiceBtn.type = 'button';
            practiceBtn.className = 'btn btn-sm btn-primary';
            practiceBtn.textContent = 'Luyện riêng';
            practiceBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                switchTab('quiz');
                initQuizQueue(t.id);
            });

            headerDiv.appendChild(titleBox);
            headerDiv.appendChild(practiceBtn);

            var detailDiv = document.createElement('div');
            detailDiv.className = 'hidden';
            detailDiv.style.marginTop = '10px';

            var chainInfo = document.createElement('div');
            chainInfo.className = 'chain-box';
            chainInfo.innerHTML = '<div><b>Chuỗi nhớ (EN):</b> ' + t.chainEn + '</div><div><b>Nghĩa (VI):</b> ' + t.chainVi + '</div>';
            detailDiv.appendChild(chainInfo);

            for (var j = 0; j < t.paragraphs.length; j++) {
                (function(p) {
                    var pBox = document.createElement('div');
                    pBox.style.marginTop = '8px';
                    pBox.style.paddingTop = '8px';
                    pBox.style.borderTop = '1px dashed var(--border)';
                    pBox.style.fontSize = '0.9rem';

                    var pHead = document.createElement('div');
                    pHead.style.fontWeight = '700';
                    pHead.style.color = 'var(--primary)';
                    pHead.textContent = 'P' + p.p + ' ➔ ' + p.ans + ' ';

                    var spkBtn = document.createElement('button');
                    spkBtn.type = 'button';
                    spkBtn.className = 'btn btn-sm btn-audio';
                    spkBtn.style.padding = '2px 6px';
                    spkBtn.textContent = '🔊';
                    spkBtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        speakText(p.ans);
                    });
                    pHead.appendChild(spkBtn);

                    var pText = document.createElement('div');
                    pText.className = 'answered';
                    pText.style.color = 'var(--sub)';
                    pText.style.fontSize = '0.86rem';
                    pText.style.marginTop = '4px';
                    pText.innerHTML = p.text;

                    pBox.appendChild(pHead);
                    pBox.appendChild(pText);
                    detailDiv.appendChild(pBox);
                })(t.paragraphs[j]);
            }

            headerDiv.addEventListener('click', function() {
                detailDiv.classList.toggle('hidden');
            });

            card.appendChild(headerDiv);
            card.appendChild(detailDiv);
            container.appendChild(card);
        })(TOPICS[i]);
    }
}

// ================= CHUYỂN TAB & KHỞI TẠO SỰ KIỆN =================
function switchTab(tab) {
    stopSpeech();
    if (timerInterval) clearInterval(timerInterval);

    document.getElementById('viewQuiz').classList.add('hidden');
    document.getElementById('viewChain').classList.add('hidden');
    document.getElementById('viewStudy').classList.add('hidden');

    document.getElementById('tabBtnQuiz').classList.remove('active');
    document.getElementById('tabBtnChain').classList.remove('active');
    document.getElementById('tabBtnStudy').classList.remove('active');

    if (tab === 'quiz') {
        document.getElementById('viewQuiz').classList.remove('hidden');
        document.getElementById('tabBtnQuiz').classList.add('active');
        renderQuestion();
    } else if (tab === 'chain') {
        document.getElementById('viewChain').classList.remove('hidden');
        document.getElementById('tabBtnChain').classList.add('active');
        loadChainDrill();
    } else if (tab === 'study') {
        document.getElementById('viewStudy').classList.remove('hidden');
        document.getElementById('tabBtnStudy').classList.add('active');
        renderStudyList();
    }
}

document.addEventListener('DOMContentLoaded', function() {
    loadSRS();
    updateHeaderBadges();
    initChainSelect();

    document.getElementById('brandBtn').addEventListener('click', function() { switchTab('quiz'); });
    document.getElementById('tabBtnQuiz').addEventListener('click', function() { switchTab('quiz'); });
    document.getElementById('tabBtnChain').addEventListener('click', function() { switchTab('chain'); });
    document.getElementById('tabBtnStudy').addEventListener('click', function() { switchTab('study'); });

    document.getElementById('quizFilter').addEventListener('change', function() { initQuizQueue(null); });
    document.getElementById('timerSetting').addEventListener('change', function() { startTimer(); });

    document.getElementById('btnSpeakPass').addEventListener('click', function() {
        if (currentItem) speakText(stripHtml(currentItem.para.text));
    });
    document.getElementById('btnSpeakAns').addEventListener('click', function() {
        if (currentItem) speakText(currentItem.para.ans);
    });
    document.getElementById('btnNextQ').addEventListener('click', function() {
        stopSpeech();
        renderQuestion();
    });

    document.getElementById('chainTopicSelect').addEventListener('change', loadChainDrill);
    document.getElementById('btnResetChain').addEventListener('click', loadChainDrill);
    document.getElementById('btnShowChain').addEventListener('click', function() {
        var topic = getSelectedChainTopic();
        for (var i = 0; i < 7; i++) chainState[i] = topic.paragraphs[i].ans;
        renderChainUI(topic);
    });
    document.getElementById('btnSpeakChain').addEventListener('click', function() {
        var topic = getSelectedChainTopic();
        var arr = [];
        for (var i = 0; i < 7; i++) arr.push('Paragraph ' + (i + 1) + ': ' + topic.paragraphs[i].ans);
        speakText(arr.join('. '));
    });

    document.getElementById('btnClearSRS').addEventListener('click', function() {
        if (confirm('Xóa lịch sử câu sai và làm lại từ đầu?')) {
            srsData = {};
            saveSRS();
            initQuizQueue(null);
        }
    });

    initQuizQueue(null);
});
</script>
